# Application Server Configuration
server.port=8080
server.servlet.context-path=/api

# Spring Database Configuration (H2 File Mode for Persistence without Docker)
spring.datasource.url=jdbc:h2:file:./data/foliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Storage Configuration
folio.storage.location=./uploads

# Ollama AI Configuration
folio.ollama.url=http://localhost:11434
folio.ollama.model=llama3.2

# JWT Security Configuration
folio.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
folio.jwt.expiration-ms=86400000

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
