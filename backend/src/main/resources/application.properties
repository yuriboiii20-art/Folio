# Application Server Configuration
server.port=8080
server.servlet.context-path=/api

# Primary Database Configuration (PostgreSQL 15)
spring.datasource.url=jdbc:postgresql://localhost:5432/foliodb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate Configuration for PostgreSQL 15
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Storage Configuration
folio.storage.location=./uploads

# Ollama AI Configuration
folio.ollama.url=http://localhost:11434
folio.ollama.model=llama3.2

# JWT Security Configuration
folio.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
folio.jwt.expiration-ms=86400000

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
