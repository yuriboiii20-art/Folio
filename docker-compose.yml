version: '3.8'

services:
  # PostgreSQL 15 Database Container
  postgres:
    image: postgres:15-alpine
    container_name: folio-postgres-15
    restart: always
    environment:
      POSTGRES_DB: foliodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foliodb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Web-based Database Explorer (Adminer Web UI)
  db-explorer:
    image: adminer:latest
    container_name: folio-db-explorer
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
